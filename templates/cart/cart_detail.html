{% load static %}
{% for item in cart_items %}
<div class="row mb-3 cart-item">
    <div class="col-md-2">
        <img src="{% static 'images/placeholder-product.jpg' %}" class="img-fluid rounded" alt="Product">
    </div>
    <div class="col-md-6">
        <h6 class="mb-1">{{ item.name }}</h6>
        <p class="text-muted mb-0">${{ item.price }}</p>
    </div>
    <div class="col-md-2">
        <form method="post" action="{% url 'cart:update_cart_item' item.product_id %}">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ item.product_id }}">
            <div class="input-group input-group-sm">
                <input type="number" name="quantity" class="form-control text-center" value="{{ item.quantity }}" min="1">
                <button type="submit" class="btn btn-outline-primary">Update</button>
            </div>
        </form>
    </div>
    <div class="col-md-1 text-center">
        <h6 class="mb-0">${{ item.total_price|floatformat:2 }}</h6>
    </div>
    <div class="col-md-1 text-end">
        <form method="post" action="{% url 'cart:remove_from_cart' item.product_id %}">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ item.product_id }}">
            <button class="btn btn-outline-danger btn-sm">
                <i class="fa-solid fa-trash"></i>
            </button>
        </form>
    </div>
</div>
{% if not forloop.last %}
<hr>
{% endif %}
{% endfor %}
