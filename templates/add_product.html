{% extends 'base.html' %}

{% block title %}Add Product{% endblock %}

{% block content %}
<h2 class="mb-4">➕ Add New Product</h2>

<form method="POST" action="/products/add">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input name="name" id="name" class="form-control" required>
  </div>
  
  <div class="mb-3">
    <label for="brand" class="form-label">Brand</label>
    <input name="brand" id="brand" class="form-control">
  </div>
  
  <div class="mb-3">
    <label for="category" class="form-label">Category</label>
    <input name="category" id="category" class="form-control">
  </div>
  
  <div class="mb-3">
    <label for="price" class="form-label">Price ($)</label>
    <input name="price" id="price" type="number" step="0.01" class="form-control">
  </div>
  
  <div class="mb-3">
    <label for="stock" class="form-label">Stock Level</label>
    <input name="stock" id="stock" type="number" class="form-control">
  </div>
  
  <button type="submit" class="btn btn-success">Add Product</button>
  <a href="/products" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
