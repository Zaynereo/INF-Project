{% extends 'base.html' %}
{% block title %}Edit Product{% endblock %}

{% block content %}
<h2>Edit Product</h2>
<form method="POST">
    <div class="mb-2">
        <label>Name:</label>
        <input name="name" class="form-control" value="{{ product.name }}" required>
    </div>
    <div class="mb-2">
        <label>Brand:</label>
        <input name="brand" class="form-control" value="{{ product.brand }}">
    </div>
    <div class="mb-2">
        <label>Category:</label>
        <input name="category" class="form-control" value="{{ product.category }}">
    </div>
    <div class="mb-2">
        <label>Price:</label>
        <input name="price" type="number" step="0.01" class="form-control" value="{{ product.price }}">
    </div>
    <div class="mb-2">
        <label>Stock:</label>
        <input name="stock" type="number" class="form-control" value="{{ product.stock_level }}">
    </div>
    <button class="btn btn-primary">Update</button>
</form>
{% endblock %}
