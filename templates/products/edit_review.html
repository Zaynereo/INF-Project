{% extends "base.html" %}
{% load static %}
{% load form_extras %}

{% block title %}Edit Review{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">Edit Your Review</h3>

            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label for="{{ form.rating.id_for_label }}" class="form-label">Rating (0-5)</label>
                {{ form.rating|add_class:"form-control w-25" }}
              </div>

              <div class="mb-3">
                <label for="{{ form.review.id_for_label }}" class="form-label">Review:</label>
                {{ form.review|add_class:"form-control" }}
              </div>

              <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">
                  <i class="fas fa-save me-1"></i>Update Review
                </button>
                <a href="{% url 'products:product_detail' product_id %}" class="btn btn-secondary">
                  Cancel
                </a>
              </div>
            </form>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
